spring.application.name=board

# 모든 API는 /api 아래에 둔다 (CloudFront /api/* → EC2, decision-3)
server.servlet.context-path=/api

# DB 접속 정보는 env로만 받는다 (decision-2). 기본값은 로컬 docker-compose.yml과 맞춘다.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/board}
spring.datasource.username=${DB_USERNAME:board}
spring.datasource.password=${DB_PASSWORD:board}

# 스키마는 Flyway가 관리하고 Hibernate는 검증만 한다
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

# 요청 본문 엄격함(TASK-20#3: 알 수 없는 필드·제어 문자 거부)은 여기서 켜지 않는다. 이 설정은 전역 JsonMapper(RestClient 등 외부 응답
# 파싱에도 쓰임)에 걸리므로, MVC 요청 본문 전용 변환기에만 건다(common.InputIntegrityConfiguration).

management.endpoints.web.exposure.include=health
# 세부 정보(DB 등)는 ADMIN 에게만 보인다. /api/actuator/health 자체는 공개다.
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN

# 웹 세션은 Spring Session JDBC (decision-5). 테이블은 Flyway(V2)가 만든다.
spring.session.jdbc.initialize-schema=never

# 세션 쿠키 SESSION: HttpOnly, SameSite=Lax. HTTPS 운영에서는 COOKIE_SECURE=true.
app.security.cookie-secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.name=SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${app.security.cookie-secure}
server.servlet.session.timeout=14d

# 자체 서명 JWT (HS256). 아래 기본값은 로컬 개발 전용이다. 운영은 반드시 env JWT_SECRET(32바이트 이상)로 덮어쓴다.
app.jwt.secret=${JWT_SECRET:dev-only-insecure-jwt-secret-change-me-0123456789}
app.jwt.issuer=board
app.jwt.access-token-ttl=PT15M
# refresh 토큰(불투명 랜덤 값, DB 에는 SHA-256 해시만) 수명. 로테이션마다 새로 센다.
app.jwt.refresh-token-ttl=${JWT_REFRESH_TTL:P14D}

# 첫 ADMIN: 이 이메일(대소문자 무시)의 LOCAL 계정은 가입 시 또는 기동 시 ADMIN 이 된다. 비우면 지정하지 않는다.
app.admin.email=${ADMIN_EMAIL:}

# 브라우저가 보는 공개 주소 (TASK-4). CloudFront 는 Host 를 넘기지 않으므로 OAuth redirect-uri 와 프론트 리다이렉트는 요청 URL 이
# 아니라 이 값으로 만든다. 로컬 기본값은 Next 개발 서버(/api 를 백엔드로 프록시). 운영: https://<cloudfront 또는 도메인>
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:3000}

# 소셜 로그인 (TASK-4). client-id 가 비어 있는 제공자는 등록하지 않는다(앱은 그대로 뜬다).
# 제공자 콘솔의 redirect URI: ${PUBLIC_BASE_URL}/api/login/oauth2/code/{google|github|naver|kakao|cognito}
app.oauth2.registrations.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth2.registrations.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.oauth2.registrations.github.client-id=${GITHUB_CLIENT_ID:}
app.oauth2.registrations.github.client-secret=${GITHUB_CLIENT_SECRET:}
# Naver (TASK-5): 토큰 요청에 client_id·client_secret 을 파라미터로 보낸다(client_secret_post)
app.oauth2.registrations.naver.client-id=${NAVER_CLIENT_ID:}
app.oauth2.registrations.naver.client-secret=${NAVER_CLIENT_SECRET:}
# Kakao (TASK-5): client-id 는 REST API 키, secret 은 콘솔 [보안]의 Client Secret(client_secret_post)
app.oauth2.registrations.kakao.client-id=${KAKAO_CLIENT_ID:}
app.oauth2.registrations.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
# Cognito (TASK-6, OIDC): Terraform infra/main/modules/cognito 출력 client_id·client_secret·issuer_uri·domain_url.
# 엔드포인트는 디스커버리 없이 domain(/oauth2/authorize·token·userInfo)과 issuer(/.well-known/jwks.json)로 만든다.
app.oauth2.registrations.cognito.client-id=${COGNITO_CLIENT_ID:}
app.oauth2.registrations.cognito.client-secret=${COGNITO_CLIENT_SECRET:}
app.oauth2.registrations.cognito.issuer-uri=${COGNITO_ISSUER_URI:}
app.oauth2.registrations.cognito.domain=${COGNITO_DOMAIN:}
# 흐름이 끝난 뒤 돌아갈 프론트 경로: 로그인 ?status=ok | ?error=코드, 계정 연결 ?linked=제공자 | ?error=코드
app.oauth2.login-redirect-path=/auth/callback/
app.oauth2.link-redirect-path=/account/
# 연결 시작 후 콜백까지 허용 시간
app.oauth2.link-intent-ttl=PT10M

# SMS (TASK-7). console(기본, 로그로만 남김 — 운영 금지) | memory(테스트) | aws(End User Messaging SMS)
app.sms.provider=${SMS_PROVIDER:console}
# + 없이 들어온 번호를 해석할 지역 (E.164 정규화)
app.sms.default-region=${SMS_DEFAULT_REGION:KR}
# provider=aws: 리전, 발신 identity(발신 번호·sender ID·pool ARN, 비우면 계정 기본), configuration set(선택)
app.sms.aws.region=${SMS_AWS_REGION:us-east-1}
app.sms.aws.origination-identity=${SMS_ORIGINATION_IDENTITY:}
app.sms.aws.configuration-set-name=${SMS_CONFIGURATION_SET:}

# 휴대폰 OTP (TASK-7). 코드 해시(HMAC-SHA256) 키는 32바이트 이상. 아래 기본값은 로컬 개발 전용 — 운영은 env OTP_HASH_KEY.
app.otp.hash-key=${OTP_HASH_KEY:dev-only-insecure-otp-hash-key-change-me-0123456789}
app.otp.ttl=PT3M
app.otp.max-attempts=5
# 발송 레이트리밋 (DB 기준, 슬라이딩 창): 같은 번호 60초 1회·24시간 N회, 같은 클라이언트 IP 1시간 M회. 넘으면 429 + Retry-After
app.otp.phone-cooldown=PT60S
app.otp.phone-daily-limit=${OTP_PHONE_DAILY_LIMIT:10}
app.otp.ip-hourly-limit=${OTP_IP_HOURLY_LIMIT:20}
# 클라이언트 IP 를 읽을 신뢰 헤더. 비우면 remote address. CloudFront 뒤(운영)는 CloudFront-Viewer-Address
# (오리진 요청 정책에 이 헤더를 포함해야 한다). X-Forwarded-For 는 쓰지 않는다.
app.client-ip.header=${CLIENT_IP_HEADER:}

# 이미지 첨부 (TASK-11). 버킷을 비우면 업로드 기능을 끈다(앱은 뜨고 presign·confirm 은 503 uploads_unavailable).
# 운영: Terraform infra/main/modules/uploads 의 버킷 + EC2 인스턴스 프로파일(s3:PutObject·GetObject·DeleteObject·*ObjectTagging).
# 로컬: docker compose 의 MinIO (make dev-storage, example.env 참고) — endpoint·path-style·access-key/secret-key 를 채운다.
app.uploads.bucket=${UPLOADS_BUCKET:}
app.uploads.region=${UPLOADS_REGION:ap-northeast-2}
app.uploads.endpoint=${UPLOADS_ENDPOINT:}
app.uploads.path-style=${UPLOADS_PATH_STYLE:false}
# 정적 자격 증명은 로컬 MinIO 전용. 비우면 SDK 기본 체인(EC2 인스턴스 프로파일)
app.uploads.access-key=${UPLOADS_ACCESS_KEY:}
app.uploads.secret-key=${UPLOADS_SECRET_KEY:}
# 첨부 공개 URL = 이 값 + 키에서 uploads/ 뒤. 운영은 CloudFront /uploads/* (같은 오리진). 로컬 MinIO: http://localhost:9000/board-uploads/uploads/
app.uploads.public-base-path=${UPLOADS_PUBLIC_BASE_PATH:/uploads/}
# presigned PUT 유효 시간, PENDING 정리 기준(S3 lifecycle 의 status=pending 1일 만료와 맞춘다)
app.uploads.presign-ttl=PT5M
app.uploads.pending-ttl=PT24H
# 미확정(PENDING) 첨부 정리 주기. pending-ttl 보다 오래된 행을 지우고 객체도 지운다(best-effort)
app.uploads.cleanup-interval=PT1H
