spring.application.name=board

# 모든 API는 /api 아래에 둔다 (CloudFront /api/* → EC2, decision-3)
server.servlet.context-path=/api

# DB 접속 정보는 env로만 받는다 (decision-2). 기본값은 로컬 docker-compose.yml과 맞춘다.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/board}
spring.datasource.username=${DB_USERNAME:board}
spring.datasource.password=${DB_PASSWORD:board}
# PostgreSQL 오류의 Detail(예: Key (provider, subject)=(LOCAL, a@b.c) — 개인정보)을 예외 메시지에 싣지 않는다(TASK-21, TASK-20 이월).
# Hibernate SqlExceptionHelper 의 ERROR 로그와 처리되지 않은 예외의 스택 트레이스에 키 값이 남지 않는다. SQLState·제약 이름은 남는다.
# 로컬에서 원인을 자세히 봐야 하면 DB_LOG_SERVER_ERROR_DETAIL=true. PostgreSQL 서버 로그 쪽은 운영 compose(deploy/docker-compose.prod.yml)가
# log_error_verbosity=terse·log_min_error_statement=panic 으로 DETAIL·실패 문장을 남기지 않는다.
spring.datasource.hikari.data-source-properties.logServerErrorDetail=${DB_LOG_SERVER_ERROR_DETAIL:false}

# DB 타임아웃 (TASK-23#1, BE-3). DB 가 죽거나 멈추거나 느려져도 요청이 무한히 매달리지 않고 30초 안에 JSON 오류로 끝난다(B2):
#   커넥션 대기(DB_CONNECTION_TIMEOUT_MS) + 트랜잭션 상한(DB_TRANSACTION_TIMEOUT) + 소켓 무응답(DB_SOCKET_TIMEOUT_SECONDS) = 5 + 10 + 10 = 25초.
#   (응답 없는 DB: 커넥션 대기 + 소켓 무응답 + 세션 저장의 커넥션 대기 = 20초. 느리지만 살아 있는 DB: 문장 하나는 statement_timeout,
#   문장 여러 개를 합친 트랜잭션은 transaction_timeout 이 끊는다.)
#   DB 에 닿지 못하면 503 db_unavailable, 락 대기가 lock_timeout 을 넘으면(55P03, 교착 40P01 포함) 409 lock_timeout,
#   쿼리가 statement_timeout 을 넘으면(57014)·트랜잭션이 transaction_timeout 을 넘으면(25P04, 서버가 세션을 끝낸다) 503 db_timeout (docs/api.md 오류 응답).
#   statement_timeout 은 socketTimeout·transaction_timeout 보다 짧게 둔다 — 살아 있는 DB 의 느린 쿼리는 서버가 먼저 취소하고(57014, 세션 유지),
#   응답 없는 DB 는 소켓에서 끊는다. transaction_timeout 은 PostgreSQL 17+ 설정이다(로컬·운영 compose 는 18).
#   한계: 상한은 트랜잭션마다다. 한 요청이 트랜잭션 여러 개(세션 조회·정지 계정 확인·본 처리·세션 저장)나 autocommit 문장 여러 개를 쓰면
#   이론상 합이 늘 수 있다(요청 단위 데드라인은 없다).
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:5000}
# 풀에서 꺼낼 때의 생존 확인. connection-timeout 보다 짧아야 죽은 커넥션을 버리고 다시 시도할 수 있다.
spring.datasource.hikari.validation-timeout=2000
# transaction_timeout(25P04)으로 서버가 끝낸 세션은 풀에서 바로 버린다(Hikari 는 08xxx 만 버린다)
spring.datasource.hikari.exception-override-class-name=com.example.board.common.DbSessionTimeoutOverride
spring.datasource.hikari.data-source-properties.connectTimeout=5
spring.datasource.hikari.data-source-properties.socketTimeout=${DB_SOCKET_TIMEOUT_SECONDS:10}
app.db.lock-timeout=${DB_LOCK_TIMEOUT:5s}
app.db.statement-timeout=${DB_STATEMENT_TIMEOUT:5s}
app.db.transaction-timeout=${DB_TRANSACTION_TIMEOUT:10s}
# 접속 시작 파라미터로 세션마다 건다(쿼리 왕복 추가 없음). 값은 PostgreSQL 시간 단위(예: 500ms, 5s).
spring.datasource.hikari.data-source-properties.options=-c lock_timeout=${app.db.lock-timeout} -c statement_timeout=${app.db.statement-timeout} -c transaction_timeout=${app.db.transaction-timeout}

# 스키마는 Flyway가 관리하고 Hibernate는 검증만 한다
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration
# 마이그레이션(인덱스 생성 등)은 statement_timeout·소켓 타임아웃으로 자르지 않는다(TASK-23#1). 풀 커넥션의 세션 변수를 바꾸면 그 커넥션이
# 타임아웃 없는 채로 풀에 남으므로, Flyway 는 같은 접속 정보로 풀 밖의 자기 커넥션을 연다(common.MigrationDataSourceConfiguration).
# lock_timeout 은 그대로 둔다(운영 중 테이블 잠금 대기를 끝없이 하지 않게).

# 요청 본문 엄격함(TASK-20#3: 알 수 없는 필드·제어 문자 거부)은 여기서 켜지 않는다. 이 설정은 전역 JsonMapper(RestClient 등 외부 응답
# 파싱에도 쓰임)에 걸리므로, MVC 요청 본문 전용 변환기에만 건다(common.InputIntegrityConfiguration).

# 요청 본문 크기 상한 (TASK-23#2, BE-4). 넘으면 413 payload_too_large(본문을 읽기 전, chunked 는 읽는 도중). 가장 큰 정상 요청인 글 작성
# (한글 제목 100자 + 본문 20000자 ≈ 60KB)이 들어가는 크기. 첨부 이미지는 S3 presigned PUT 이라 여기 해당하지 않는다.
app.request.max-body-size=64KB
# form 본문(application/x-www-form-urlencoded)은 서블릿 컨테이너가 getParameter 때 직접 읽는다(CSRF 필터의 _csrf 조회 등) — 필터의
# 스트림 상한을 거치지 않으므로 컨테이너 상한도 같게 둔다. chunked form 이 넘으면 RequestBodyLimitFilter 가 413 으로 바꾼다.
server.tomcat.max-http-form-post-size=64KB
# multipart 는 받지 않는다(멀티파트 엔드포인트 없음, 첨부는 S3 presigned PUT). MultipartResolver·서블릿 multipart 설정이 없으면 본문을 파싱하지 않는다.
spring.servlet.multipart.enabled=false

management.endpoints.web.exposure.include=health
# 세부 정보(DB 등)는 ADMIN 에게만 보인다. /api/actuator/health 자체는 공개다.
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN

# 웹 세션은 Spring Session JDBC (decision-5). 테이블은 Flyway(V2)가 만든다.
spring.session.jdbc.initialize-schema=never

# 운영 모드 (TASK-21): auto(기본)면 PUBLIC_BASE_URL 이 https 일 때 운영이다. 운영 배포(deploy/render-env.sh)는 PRODUCTION_MODE=true 를 기본으로 넣는다. 운영이면 기동 시 안전 설정을 검사해서(dev 비밀값·
# COOKIE_SECURE·DB 비밀번호 등, security.ProductionSafetyCheck) 하나라도 어긋나면 고칠 것을 나열하고 기동을 멈춘다. true|false 로 강제.
app.security.production-mode=${PRODUCTION_MODE:auto}

# 세션 쿠키 SESSION: HttpOnly, SameSite=Lax. HTTPS 운영에서는 COOKIE_SECURE=true(운영 모드에서 false 면 기동 실패).
app.security.cookie-secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.name=SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${app.security.cookie-secure}
server.servlet.session.timeout=14d

# 자체 서명 JWT (HS256). 아래 기본값은 로컬 개발 전용이다. 운영은 반드시 env JWT_SECRET(32바이트 이상)로 덮어쓴다.
app.jwt.secret=${JWT_SECRET:dev-only-insecure-jwt-secret-change-me-0123456789}
app.jwt.issuer=board
app.jwt.access-token-ttl=PT15M
# refresh 토큰(불투명 랜덤 값, DB 에는 SHA-256 해시만) 수명. 로테이션마다 새로 센다.
app.jwt.refresh-token-ttl=${JWT_REFRESH_TTL:P14D}

# 첫 ADMIN: 기동 시 ADMIN 이 하나도 없고 이 이메일(대소문자 무시)의 LOCAL 계정이 이미 있으면 한 번 ADMIN 으로 올린다. 가입만으로는
# ADMIN 이 되지 않는다(TASK-21#3: 가입 → 운영자가 소유 확인 → 그때 설정·재시작 → 승격 뒤 비운다). 비우면 지정하지 않는다.
app.admin.email=${ADMIN_EMAIL:}

# 브라우저가 보는 공개 주소 (TASK-4). CloudFront 는 Host 를 넘기지 않으므로 OAuth redirect-uri 와 프론트 리다이렉트는 요청 URL 이
# 아니라 이 값으로 만든다. 로컬 기본값은 Next 개발 서버(/api 를 백엔드로 프록시). 운영: https://<cloudfront 또는 도메인>
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:3000}

# 소셜 로그인 (TASK-4). client-id 가 비어 있는 제공자는 등록하지 않는다(앱은 그대로 뜬다).
# 제공자 콘솔의 redirect URI: ${PUBLIC_BASE_URL}/api/login/oauth2/code/{google|github|naver|kakao|cognito}
app.oauth2.registrations.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth2.registrations.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.oauth2.registrations.github.client-id=${GITHUB_CLIENT_ID:}
app.oauth2.registrations.github.client-secret=${GITHUB_CLIENT_SECRET:}
# Naver (TASK-5): 토큰 요청에 client_id·client_secret 을 파라미터로 보낸다(client_secret_post)
app.oauth2.registrations.naver.client-id=${NAVER_CLIENT_ID:}
app.oauth2.registrations.naver.client-secret=${NAVER_CLIENT_SECRET:}
# Kakao (TASK-5): client-id 는 REST API 키, secret 은 콘솔 [보안]의 Client Secret(client_secret_post)
app.oauth2.registrations.kakao.client-id=${KAKAO_CLIENT_ID:}
app.oauth2.registrations.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
# Cognito (TASK-6, OIDC): Terraform infra/main/modules/cognito 출력 client_id·client_secret·issuer_uri·domain_url.
# 엔드포인트는 디스커버리 없이 domain(/oauth2/authorize·token·userInfo)과 issuer(/.well-known/jwks.json)로 만든다.
app.oauth2.registrations.cognito.client-id=${COGNITO_CLIENT_ID:}
app.oauth2.registrations.cognito.client-secret=${COGNITO_CLIENT_SECRET:}
app.oauth2.registrations.cognito.issuer-uri=${COGNITO_ISSUER_URI:}
app.oauth2.registrations.cognito.domain=${COGNITO_DOMAIN:}
# 흐름이 끝난 뒤 돌아갈 프론트 경로: 로그인 ?status=ok | ?error=코드, 계정 연결 ?linked=제공자 | ?error=코드
app.oauth2.login-redirect-path=/auth/callback/
app.oauth2.link-redirect-path=/account/
# 연결 시작 후 콜백까지 허용 시간
app.oauth2.link-intent-ttl=PT10M
# 제공자 HTTP 호출(토큰 교환·userinfo·JWKS) 타임아웃 (TASK-25#3, BE-21). 넘으면 콜백은 프론트로 302 ?error=invalid_token_response |
# invalid_user_info_response | invalid_id_token. 콜백 한 번이 셋을 차례로 부르므로 최악은 대략 (연결 + 읽기) × 3. 양수가 아니면 기동 실패
app.oauth2.http.connect-timeout=${OAUTH_HTTP_CONNECT_TIMEOUT:3s}
app.oauth2.http.read-timeout=${OAUTH_HTTP_READ_TIMEOUT:5s}

# SMS (TASK-7). console(기본, 로그로만 남김 — 번호 마스킹, 운영 모드면 기동 실패) | memory(테스트) | aws(End User Messaging SMS)
app.sms.provider=${SMS_PROVIDER:console}
# + 없이 들어온 번호를 해석할 지역 (E.164 정규화)
app.sms.default-region=${SMS_DEFAULT_REGION:KR}
# SMS 를 보낼 수 있는 번호의 지역(쉼표로 여럿, ISO 3166-1). 이 지역의 휴대폰(MOBILE·FIXED_LINE_OR_MOBILE)만 — 그 밖은 발송 전 400
# phone_not_allowed (TASK-22#4, SMS pumping 방지). 모르는 코드면 기동 실패
app.sms.allowed-regions=${SMS_ALLOWED_REGIONS:KR}
# provider=aws: 리전, 발신 identity(발신 번호·sender ID·pool ARN, 비우면 계정 기본), configuration set(선택)
app.sms.aws.region=${SMS_AWS_REGION:us-east-1}
app.sms.aws.origination-identity=${SMS_ORIGINATION_IDENTITY:}
app.sms.aws.configuration-set-name=${SMS_CONFIGURATION_SET:}
# provider=aws: SendTextMessage 호출 전체(재시도 포함)·시도별 상한 (TASK-25#4, BE-24). 넘으면 503 sms_unavailable(챌린지는 발송 한도에
# 포함). 양수여야 하고 시도별 ≤ 전체, 아니면 기동 실패. 시도가 타임아웃된 뒤 SDK 가 재시도하므로 드물게 같은 인증번호 SMS 가 두 번 갈 수 있다
app.sms.aws.api-call-timeout=${SMS_API_CALL_TIMEOUT:10s}
app.sms.aws.api-call-attempt-timeout=${SMS_API_CALL_ATTEMPT_TIMEOUT:4s}

# 휴대폰 OTP (TASK-7). 코드 해시(HMAC-SHA256) 키는 32바이트 이상. 아래 기본값은 로컬 개발 전용 — 운영은 env OTP_HASH_KEY.
app.otp.hash-key=${OTP_HASH_KEY:dev-only-insecure-otp-hash-key-change-me-0123456789}
app.otp.ttl=PT3M
app.otp.max-attempts=5
# 발송 레이트리밋 (DB 기준, 슬라이딩 창): 같은 번호 60초 1회·24시간 N회, 같은 클라이언트 IP 1시간 M회. 넘으면 429 + Retry-After
# 기동 시 검증(TASK-25#6): 횟수(max-attempts·phone-daily-limit·ip-hourly-limit) 1 이상, ttl 양수, phone-cooldown 0 이상. 어기면 기동 실패
app.otp.phone-cooldown=PT60S
app.otp.phone-daily-limit=${OTP_PHONE_DAILY_LIMIT:10}
app.otp.ip-hourly-limit=${OTP_IP_HOURLY_LIMIT:20}
# 클라이언트 IP 를 읽을 신뢰 헤더. 비우면 remote address. CloudFront 뒤(운영)는 CloudFront-Viewer-Address
# (오리진 요청 정책에 이 헤더를 포함해야 한다). X-Forwarded-For 는 쓰지 않는다. 운영 모드에서 비어 있으면 기동 실패, 설정했는데
# 요청에 헤더가 없으면 WARN(1분에 한 번) (TASK-21#2)
app.client-ip.header=${CLIENT_IP_HEADER:}

# 이미지 첨부 (TASK-11). 버킷을 비우면 업로드 기능을 끈다(앱은 뜨고 presign·confirm 은 503 uploads_unavailable).
# 운영: Terraform infra/main/modules/uploads 의 버킷 + EC2 인스턴스 프로파일(s3:PutObject·GetObject·DeleteObject·*ObjectTagging).
# 로컬: docker compose 의 MinIO (make dev-storage, example.env 참고) — endpoint·path-style·access-key/secret-key 를 채운다.
app.uploads.bucket=${UPLOADS_BUCKET:}
app.uploads.region=${UPLOADS_REGION:ap-northeast-2}
app.uploads.endpoint=${UPLOADS_ENDPOINT:}
app.uploads.path-style=${UPLOADS_PATH_STYLE:false}
# 정적 자격 증명은 로컬 MinIO 전용. 비우면 SDK 기본 체인(EC2 인스턴스 프로파일)
app.uploads.access-key=${UPLOADS_ACCESS_KEY:}
app.uploads.secret-key=${UPLOADS_SECRET_KEY:}
# 첨부 공개 URL = 이 값 + 키에서 uploads/ 뒤. 운영은 CloudFront /uploads/* (같은 오리진). 로컬 MinIO: http://localhost:9000/board-uploads/uploads/
app.uploads.public-base-path=${UPLOADS_PUBLIC_BASE_PATH:/uploads/}
# presigned PUT 유효 시간, PENDING 정리 기준(S3 lifecycle 의 status=pending 1일 만료와 맞춘다)
app.uploads.presign-ttl=PT5M
app.uploads.pending-ttl=PT24H
# 미확정(PENDING) 첨부 정리 주기. pending-ttl 보다 오래된 행을 지우고 객체도 지운다(best-effort)
app.uploads.cleanup-interval=PT1H
# 연결 해제·삭제 글 첨부의 지연 삭제 (TASK-26#4, BE-36). 글에서 뗀(또는 확정만 하고 붙이지 않은) 첨부와 삭제된 글의 첨부는 이 기간이 지나면
# cleanup-interval 마다 행과 S3 객체를 지운다. 이 안에 다시 붙이거나 관리자가 글을 복구하면 이미지가 그대로다. 지운 뒤에도 CloudFront 엣지 캐시
# (CachingOptimized 기본 24시간) 동안은 열릴 수 있다. 양수여야 한다(ISO-8601 P7D 또는 7d)
app.uploads.orphan-grace-period=${UPLOADS_ORPHAN_GRACE_PERIOD:P7D}
# S3 호출(HeadObject·DeleteObjectTagging·DeleteObject) 하나의 전체(재시도 포함)·HTTP 시도별 상한 (TASK-26#3, BE-35). 넘거나 S3 가
# 403·5xx·연결 오류면 503 storage_unavailable(TASK-26#1). 양수여야 하고 시도별 ≤ 전체, 아니면 기동 실패. presign 서명은 DB 트랜잭션 밖에서 한다
app.uploads.api-call-timeout=${UPLOADS_API_CALL_TIMEOUT:5s}
app.uploads.api-call-attempt-timeout=${UPLOADS_API_CALL_ATTEMPT_TIMEOUT:2s}

# 레이트리밋 (TASK-22, DB 기준 슬라이딩 창 — rate_limit_events). 넘으면 429 rate_limited + Retry-After(초). 키는 해시로만 저장한다.
# 로그인 실패: (계정(정규화 이메일), 클라이언트 IP) 조합별 15분 창 안 실패 5회(슬라이딩 창, login-account — 이름과 달리 계정+IP 키), 클라이언트 IP 별 1시간 30회. 한도에 이르면 비밀번호를 검사하지 않는다(계정이 없어도 같은 응답)
app.rate-limit.login-account.max=${RATE_LIMIT_LOGIN_ACCOUNT_MAX:5}
app.rate-limit.login-account.window=PT15M
app.rate-limit.login-ip.max=${RATE_LIMIT_LOGIN_IP_MAX:30}
app.rate-limit.login-ip.window=PT1H
# 가입 시도: 클라이언트 IP 별 1시간 10회
app.rate-limit.signup-ip.max=${RATE_LIMIT_SIGNUP_IP_MAX:10}
app.rate-limit.signup-ip.window=PT1H
# step-up 비밀번호 실패: 사용자별 15분 창 안 5회(슬라이딩 창 — 고정 15분 잠금이 아니라 가장 오래된 실패가 창 밖으로 나가면 한 번 더 된다)
app.rate-limit.step-up.max=5
app.rate-limit.step-up.window=PT15M
# 글 작성: 사용자별 1분 3회·1시간 30회, 댓글 작성: 사용자별 1분 10회. ADMIN 도 예외 없음. 실패한(롤백된) 작성은 세지 않는다
app.rate-limit.post-minute.max=${RATE_LIMIT_POST_MINUTE_MAX:3}
app.rate-limit.post-minute.window=PT1M
app.rate-limit.post-hour.max=${RATE_LIMIT_POST_HOUR_MAX:30}
app.rate-limit.post-hour.window=PT1H
app.rate-limit.comment.max=${RATE_LIMIT_COMMENT_MAX:10}
app.rate-limit.comment.window=PT1M
# 첨부 presign: 사용자별 1시간 60회(429), 미확정(PENDING) 첨부 최대 20개(넘으면 409 too_many_pending_attachments)
app.rate-limit.presign.max=${RATE_LIMIT_PRESIGN_MAX:60}
app.rate-limit.presign.window=PT1H
app.rate-limit.max-pending-attachments=${RATE_LIMIT_MAX_PENDING_ATTACHMENTS:20}
