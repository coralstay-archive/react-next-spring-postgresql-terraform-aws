# k8s(로컬 k3d) 프로필 (TASK-36#3). 기동 시 Flyway 마이그레이션을 하지 않는다 — 마이그레이션은 k8s Job(board-migrate, MigrationJob)이 한다.
# docker-compose·테스트·AWS(EC2 compose)는 기본 프로필이라 그대로 기동 시 마이그레이션한다.
spring.flyway.enabled=false

# k8s 프로브: /api/actuator/health/liveness·readiness (deploy/k8s/profiles/core/backend.yaml)
management.endpoint.health.probes.enabled=true
