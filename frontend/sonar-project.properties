# SonarQube 프론트 분석 설정 (TASK-67#4). make sonar-scan 이 스캐너 컨테이너(deploy/sonar/scanner)로 읽는다.
# 서버 주소·토큰은 환경변수(SONAR_HOST_URL·SONAR_TOKEN)로만 — 여기에 두지 않는다(B2).
sonar.projectKey=board-frontend
sonar.projectName=board frontend
sonar.sourceEncoding=UTF-8
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx
# npm run test:coverage(vitest v8)가 만든다
sonar.javascript.lcov.reportPaths=coverage/lcov.info
