# 로컬 개발용: PostgreSQL + 첨부 저장소 MinIO(S3 호환, TASK-11)
# 값은 셸 환경변수 또는 repo 루트의 env 파일(example.env 참고)로 덮어쓸 수 있다.
services:
  postgres:
    image: postgres:18-alpine
    container_name: board-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-board}
      POSTGRES_USER: ${POSTGRES_USER:-board}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-board}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 첨부 이미지 저장소 (TASK-11#3). 앱은 S3 API(presigned PUT·HeadObject·태그)로 쓴다. 콘솔 http://localhost:9001
  # Docker Hub 의 minio/minio 이미지는 더 이상 받을 수 없어 Chainguard 빌드를 digest 로 고정한다(테스트와 같은 이미지).
  minio:
    image: cgr.dev/chainguard/minio@sha256:7df55d002b698e4494a131b848dd553361bbe58b7e19f62d9623c29af1ba9ccf
    container_name: board-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # 브라우저가 presigned URL 로 직접 PUT 하므로 프론트 개발 서버 origin 의 CORS 를 허용한다.
      # MinIO 는 버킷 CORS API(PutBucketCors)를 구현하지 않아 서버 전역 설정으로 준다(운영 S3 는 Terraform uploads 모듈의 버킷 CORS).
      MINIO_API_CORS_ALLOW_ORIGIN: ${PUBLIC_BASE_URL:-http://localhost:3000}
      # healthcheck 의 mc ready 용 alias
      MC_HOST_local: http://${MINIO_ROOT_USER:-minioadmin}:${MINIO_ROOT_PASSWORD:-minioadmin}@127.0.0.1:9000
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 한 번 돌고 끝나는 버킷 준비: 버킷 생성 + uploads/ 익명 읽기(로컬에서 첨부 url 로 이미지를 바로 보려고). 다시 돌려도 안전하다.
  minio-init:
    image: cgr.dev/chainguard/minio@sha256:7df55d002b698e4494a131b848dd553361bbe58b7e19f62d9623c29af1ba9ccf
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER:-minioadmin}:${MINIO_ROOT_PASSWORD:-minioadmin}@minio:9000
      UPLOADS_BUCKET: ${UPLOADS_BUCKET:-board-uploads}
    entrypoint: ["sh", "-c"]
    command:
      - mc mb --ignore-existing "local/$${UPLOADS_BUCKET}" && mc anonymous set download "local/$${UPLOADS_BUCKET}/uploads"
    restart: "no"

volumes:
  pgdata:
  miniodata:
