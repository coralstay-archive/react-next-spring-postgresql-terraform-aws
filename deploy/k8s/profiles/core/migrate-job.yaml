# Flyway 마이그레이션 Job (TASK-36#3). 앱 기동과 분리한다 — 백엔드 이미지에 든 마이그레이션(classpath:db/migration)을
# Spring 없이 MigrationJob(com.example.board.common)이 적용한다. PostgreSQL 이 뜰 때까지 접속을 다시 시도한다.
# board.dev/rerun=true: scripts/k3d.sh 가 적용할 때마다 지우고 새로 만든다(Job 은 고칠 수 없다 — 새 이미지의 마이그레이션이 매번 돈다).
apiVersion: batch/v1
kind: Job
metadata:
  name: board-migrate
  labels:
    board.dev/rerun: "true"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: migrate
          image: k3d-registry.localhost:5001/board-backend:dev
          imagePullPolicy: Always
          command: ["java", "-cp", "/app/BOOT-INF/classes:/app/BOOT-INF/lib/*", "com.example.board.common.MigrationJob", "migrate"]
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx128m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
          envFrom:
            - secretRef:
                name: board-env
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 256Mi
