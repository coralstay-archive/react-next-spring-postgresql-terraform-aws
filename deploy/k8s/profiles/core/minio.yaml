# 첨부 저장소 MinIO (docker-compose 와 같은 Chainguard 이미지·digest). 메모리 한도 256Mi.
# 버킷 준비 Job(board-minio-init)은 compose 의 minio-init 과 같다: 버킷 생성 + uploads/ 익명 읽기. 다시 돌려도 안전하다.
apiVersion: v1
kind: Service
metadata:
  name: board-minio
spec:
  selector:
    app.kubernetes.io/name: board-minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: board-minio
spec:
  serviceName: board-minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: board-minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: board-minio
    spec:
      containers:
        - name: minio
          image: cgr.dev/chainguard/minio@sha256:7df55d002b698e4494a131b848dd553361bbe58b7e19f62d9623c29af1ba9ccf
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: board-env
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: board-env
                  key: MINIO_ROOT_PASSWORD
            - name: MINIO_API_CORS_ALLOW_ORIGIN
              value: http://board.localhost
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: board-minio-init
  labels:
    board.dev/rerun: "true"
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: minio-init
          image: cgr.dev/chainguard/minio@sha256:7df55d002b698e4494a131b848dd553361bbe58b7e19f62d9623c29af1ba9ccf
          command: ["sh", "-c"]
          args:
            # 자격 증명은 URL(mc 의 호스트 env 형식 http://user:pass@...)에 넣지 않는다 — @:/#% 같은 문자가 URL 을 깨뜨린다. env 로 받아 인자로 넘긴다.
            # mc alias set 은 서버에 붙어 보므로 MinIO 가 뜰 때까지 다시 한다(최대 60회 × 2초, 넘으면 실패 — Job 이 Failed 로 끝나 원인이 로그에 남는다).
            - >-
              n=0; until mc alias set local http://board-minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null; do
              n=$((n+1)); [ "$n" -lt 60 ] || exit 1; sleep 2; done
              && until mc ready local; do sleep 2; done
              && mc mb --ignore-existing "local/$UPLOADS_BUCKET"
              && mc anonymous set download "local/$UPLOADS_BUCKET/uploads"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: board-env
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: board-env
                  key: MINIO_ROOT_PASSWORD
            - name: UPLOADS_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: board-backend-config
                  key: UPLOADS_BUCKET
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 64Mi
