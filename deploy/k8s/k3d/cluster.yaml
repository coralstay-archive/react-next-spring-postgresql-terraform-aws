# 로컬 k3d 클러스터 (TASK-36). scripts/k3d.sh up 이 k3d cluster create --config 로 쓴다.
# 8GB M1 · Docker VM 5GB: 서버 1대(에이전트 없음), metrics-server 끔. 들어오는 길: 호스트 127.0.0.1:80 → k3d LB 컨테이너 → Traefik(k3s 기본 인그레스).
# 로컬 레지스트리: 호스트에서 localhost:5001 로 push, 노드는 k3d-registry.localhost:5001 로 pull(k3d 가 노드의 registries.yaml 을 만든다).
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: board
servers: 1
agents: 0
# k3d v5.9.0 의 기본 k3s 를 고정한다(올릴 때 kubeconform 스키마 버전 scripts/k8s-validate.sh 도 같이 본다)
image: rancher/k3s:v1.36.4-k3s1
ports:
  # 루프백에만 연다. 브라우저·스모크: http://board.localhost (또는 127.0.0.1 + Host: board.localhost)
  - port: 127.0.0.1:80:80
    nodeFilters:
      - loadbalancer
registries:
  create:
    name: registry.localhost
    host: "127.0.0.1"
    hostPort: "5001"
options:
  k3d:
    wait: true
    timeout: "180s"
  k3s:
    extraArgs:
      - arg: --disable=metrics-server
        nodeFilters:
          - server:*
  kubeconfig:
    updateDefaultKubeconfig: true
    # 사용자의 현재 컨텍스트는 바꾸지 않는다 — 스크립트는 --context k3d-board 로만 부른다
    switchCurrentContext: false
