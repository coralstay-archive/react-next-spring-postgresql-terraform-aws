# CI (TASK-17#4): PR 과 main 이 아닌 브랜치 push 에서 전체 테스트(make test)와 빌드를 돌린다.
# make test = repo·배포 스크립트(shellcheck·actionlint·dry-run) + terraform fmt·validate·test(mock, 자격 증명 없음)
#           + 백엔드(Testcontainers: 러너의 Docker) + 프론트(vitest).
# deploy.yml 이 workflow_call 로 재사용한다(main 배포 전 같은 테스트).
# 액션은 메이저 버전 태그로 고정한다(공식·검증된 배포자만 씀). SHA 고정이 필요하면 Dependabot 과 함께 바꾼다(README).
name: ci

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # PR·브랜치는 새 push 가 오면 이전 실행을 취소한다. main(배포 전 테스트)은 취소하지 않는다
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle*
            backend/gradle/wrapper/gradle-wrapper.properties

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.16"
          terraform_wrapper: false

      - name: Install actionlint
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12 "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: make test
        env:
          REQUIRE_LINTERS: "1"
        run: make test

      - name: Build backend (bootJar)
        working-directory: backend
        run: ./gradlew bootJar --console=plain

      - name: Build frontend (static export)
        working-directory: frontend
        run: npm run build
