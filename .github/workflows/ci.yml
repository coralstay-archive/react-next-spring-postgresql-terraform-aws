# CI (TASK-17#4): PR 과 main 이 아닌 브랜치 push 에서 전체 테스트(make test)와 빌드를 돌린다.
# make test = repo·배포 스크립트(shellcheck·actionlint·dry-run) + terraform fmt·validate·test(mock, 자격 증명 없음)
#           + 백엔드(Testcontainers: 러너의 Docker) + 프론트(vitest).
# deploy.yml 이 workflow_call 로 재사용한다(main 배포 전 같은 테스트).
# 액션은 메이저 버전 태그로 고정한다(공식·검증된 배포자만 씀). SHA 고정이 필요하면 Dependabot 과 함께 바꾼다(README).
name: ci

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # PR·브랜치는 새 push 가 오면 이전 실행을 취소한다. main(배포 전 테스트)은 취소하지 않는다
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle*
            backend/gradle/wrapper/gradle-wrapper.properties

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.16"
          terraform_wrapper: false

      # TASK-19: Ubuntu 패키지 shellcheck 는 로컬(0.11)보다 오래돼 다른 경고를 낸다. 같은 버전을 고정 설치한다.
      # 버전을 올릴 때는 SHELLCHECK_SHA256 도 같이 바꾼다(deploy_test.sh 가 로컬 버전과 이 값을 비교한다).
      - name: Install shellcheck (pinned)
        env:
          SHELLCHECK_VERSION: "0.11.0"
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          tarball="$RUNNER_TEMP/shellcheck.tar.xz"
          curl -sSfL --retry 3 -o "$tarball" "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  ${tarball}" | sha256sum -c -
          tar -xJf "$tarball" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" "$RUNNER_TEMP/bin/shellcheck"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install actionlint
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12 "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # TASK-35#1: repo_test 가 build-diagrams.py --check 로 커밋된 SVG 를 검사하게 graphviz 를 설치한다. Ubuntu 패키지(2.43)는
      # diagrams/render-env.txt 와 환경이 달라 바이트 비교는 SKIP 되고, 구조(글자·요소·색 토큰·모양 종류)·문서 블록·파일 목록을 비교한다.
      - name: Install graphviz
        run: sudo apt-get update -qq && sudo apt-get install -y graphviz

      - name: make test
        env:
          REQUIRE_LINTERS: "1"
        run: make test

      - name: Build backend (bootJar)
        working-directory: backend
        run: ./gradlew bootJar --console=plain

      - name: Build frontend (static export)
        working-directory: frontend
        run: npm run build
