# 코드 품질 (TASK-67#6): PR 마다 SonarQube Community Build 를 서비스 컨테이너로 띄워 백엔드·프론트를 분석하고 품질 게이트를 본다.
# 로컬 make sonar-scan 과 같은 스크립트(scripts/sonar.sh init·scan)를 쓴다. 이미지는 deploy/sonar/compose.yaml 과 같은 다이제스트
# (scripts/test/sonar_test.sh 가 비교한다). secret 은 쓰지 않는다 — 관리자 비밀번호는 실행마다 무작위 값으로 API 로 바꾸고, 분석 토큰도
# 그때 만든다(러너 임시 디렉터리, 로그는 마스킹). 서버는 실행마다 새로 뜨므로 매번 "첫 분석"이다 — 새 코드 게이트는 로컬 서버에서 의미가 있다(README).
# 액션은 ci.yml 과 같은 메이저 버전 태그로 고정한다.
name: sonar

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      sonar-db:
        image: docker.io/library/postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_USER: sonar
          POSTGRES_PASSWORD: sonar
          POSTGRES_DB: sonar
        options: >-
          --health-cmd "pg_isready -U sonar -d sonar"
          --health-interval 5s --health-timeout 5s --health-retries 20
      sonarqube:
        image: docker.io/library/sonarqube:26.10.0.133078-community@sha256:aa0d41212704d1ed35f7ae3b49886b39f639590baf8020cdb191c2a2eb8f9eae
        env:
          SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
          SONAR_JDBC_USERNAME: sonar
          SONAR_JDBC_PASSWORD: sonar
          # 서비스는 단계보다 먼저 떠서 러너의 vm.max_map_count 를 바꿀 수 없다 — 일회성 서버라 내장 ES 부트스트랩 검사를 끈다
          SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
          SONAR_TELEMETRY_ENABLE: "false"
        ports:
          - "9000:9000"
    steps:
      # 스캐너가 git 이력으로 줄 단위 변경(blame)을 읽는다
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle*
            backend/gradle/wrapper/gradle-wrapper.properties

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 기동 대기 → 관리자 비밀번호(무작위)·분석 토큰. 값은 SONAR_CONFIG_DIR(0600)에만 두고 ::add-mask:: 로 가린다
      - name: SonarQube admin password + token
        run: |
          echo "SONAR_CONFIG_DIR=$RUNNER_TEMP/sonar" >> "$GITHUB_ENV"
          SONAR_CONFIG_DIR=$RUNNER_TEMP/sonar scripts/sonar.sh init

      # 백엔드(gradle JaCoCo)·프론트(vitest lcov + 스캐너 컨테이너), sonar.qualitygate.wait=true — 게이트 실패면 실패
      - name: Analyze + quality gate
        run: scripts/sonar.sh scan
